server:
  port: 8080
  host: "0.0.0.0"
  shutdownTimeout: 30

backends:
  - url: "http://localhost:8081"
    weight: 1
  - url: "http://localhost:8082"
    weight: 1
  - url: "http://localhost:8083"
    weight: 1

loadBalancing:
  algorithm: "round-robin"

healthCheck:
  interval: 10
  timeout: 3

circuitBreaker:
  enabled: true
  maxFailures: 5
  timeout: 60
  resetTimeout: 30
  halfOpenSuccess: 2

rateLimit:
  enabled: false  # Disable for max performance testing
  requestsPerSec: 1000000
  burst: 2000000
  perIP: false
