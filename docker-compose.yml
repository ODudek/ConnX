# Quick start Docker Compose setup for ConnX
# Run with: docker-compose up -d

version: '3.8'

services:
  # ConnX proxy server
  connx:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./configs/examples/basic.yaml:/app/configs/config.yaml:ro
    depends_on:
      - backend1
      - backend2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Example backend services (using nginx)
  backend1:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./examples/html:/usr/share/nginx/html:ro
    restart: unless-stopped

  backend2:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./examples/html:/usr/share/nginx/html:ro
    restart: unless-stopped

  # Optional: Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/examples/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped

networks:
  default:
    driver: bridge