# Configuration with weighted round-robin load balancing
# Higher weight = more traffic
server:
  port: 8080
  host: "0.0.0.0"
  shutdownTimeout: 30

backends:
  - url: "http://powerful-backend:8080"
    weight: 5  # Gets 5x more traffic
  - url: "http://medium-backend:8080"
    weight: 3  # Gets 3x more traffic
  - url: "http://small-backend:8080"
    weight: 1  # Gets 1x traffic (baseline)

loadBalancing:
  algorithm: "weighted-round-robin"

healthCheck:
  interval: 30
  timeout: 5

circuitBreaker:
  enabled: true
  maxFailures: 5
  timeout: 60
  resetTimeout: 30
  halfOpenSuccess: 2

rateLimit:
  enabled: false
