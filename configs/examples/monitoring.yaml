# ConnX configuration with monitoring focus
# Shows how to set up ConnX for monitoring with Prometheus

server:
  port: 8080
  host: "0.0.0.0"

backends:
  - "http://web-app-1:3000"
  - "http://web-app-2:3000"
  - "http://web-app-3:3000"

healthCheck:
  interval: 15  # Frequent health checks for better monitoring
  timeout: 5

