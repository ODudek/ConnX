# Docker Compose setup for ConnX
# Run with: docker-compose up -d

version: '3.8'

services:
  connx:
    image: odudek/connx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml
    command: ["-config=/app/config.yaml"]
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped

  app1:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  app2:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  app3:
    image: nginx:alpine
    ports:
      - "8083:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'